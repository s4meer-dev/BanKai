[project]
name = "bankai-backend"
version = "0.1.0"
description = "BAN KAI: Autonomous Multi-Agent AI Research & Execution Platform Backend"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "s4meer-dev", email = "sameer3sn7@gmail.com" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.3",
    "pgvector>=0.3.6",
    "langgraph>=0.2.45",
    "langchain-core>=0.3.15",
    "httpx>=0.27.2",
    "aiohttp>=3.10.10",
    "beautifulsoup4>=4.12.3",
    "duckduckgo-search>=6.3.0",
    "pandas>=2.2.3",
    "numpy>=2.1.2",
    "openpyxl>=3.1.5",
    "python-docx>=1.1.2",
    "python-pptx>=1.0.2",
    "reportlab>=4.2.5",
    "plotly>=5.24.1",
    "python-multipart>=0.0.12",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "psutil>=6.1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.7.2",
    "mypy>=1.13.0"
]
observability = [
    "langfuse>=2.53.0",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0"
]
e2b = [
    "e2b>=1.0.5"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
