services:
  # PostgreSQL with pgvector extension
  postgres:
    image: pgvector/pgvector:pg16
    container_name: bankai-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bankai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bankai_secret}
      POSTGRES_DB: ${POSTGRES_DB:-bankai_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bankai -d bankai_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis for pub/sub event distribution and caching
  redis:
    image: redis:7-alpine
    container_name: bankai-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Backend FastAPI application
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bankai-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://bankai:bankai_secret@postgres:5432/bankai_db
      - REDIS_URL=redis://redis:6379/0
      - USE_SQLITE_FALLBACK=false
      - APP_ENV=production
      - DEBUG=false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/storage:/app/storage

  # Frontend Next.js application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bankai-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:

